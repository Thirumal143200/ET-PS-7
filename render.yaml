services:
  - type: web
    name: cni-cyber-backend
    env: python
    rootDir: backend
    region: singapore
    buildCommand: "pip install -r requirements.txt && pip install bcrypt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./cni_cyber_db.sqlite
