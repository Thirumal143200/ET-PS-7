version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cni_postgres_prod
    environment:
      POSTGRES_DB: cni_cyber_db
      POSTGRES_USER: cni_admin
      POSTGRES_PASSWORD: cni_prod_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cni_admin -d cni_cyber_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: cni_backend_prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://cni_admin:cni_prod_secure_password_2026@postgres:5432/cni_cyber_db
      - SECRET_KEY=cni_cyber_resilience_secret_key_change_in_production_2026
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: cni_frontend_prod
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_prod_data:
